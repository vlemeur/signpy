minimum_prek_version = "0.4.0"
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-added-large-files" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "detect-private-key" },
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
]

# Use the versions in uv.lock for both local development and CI.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run --locked ruff check --fix"
language = "system"
types_or = ["python", "pyi", "jupyter"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run --locked ruff format"
language = "system"
types_or = ["python", "pyi", "jupyter"]

[[repos.hooks]]
id = "ty"
name = "ty check"
entry = "uv run --locked ty check"
language = "system"
types_or = ["python", "pyi"]
pass_filenames = false
